{% extends 'base.html' %}

{% block title %}Email Sent - Daily Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm text-center">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4 text-success">
                    <!-- A clean, CSS-based checkmark icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-envelope-check" viewBox="0 0 16 16">
                      <path d="M2 2a2 2 0 0 0-2 2v8.01A2 2 0 0 0 2 14h5.5a.5.5 0 0 0 0-1H2a1 1 0 0 1-.966-.741l5.64-3.471L8 9.583l7-4.2V8.5a.5.5 0 0 0 1 0V4a2 2 0 0 0-2-2H2Zm3.708 6.208L1 11.105V5.383l4.708 2.825ZM1 4.217V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v.217l-7 4.2-7-4.2Z"/>
                      <path d="M16 12.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Zm-1.993-1.679a.5.5 0 0 0-.71-.07l-1.85 1.48-.777-.583a.5.5 0 0 0-.6.8l1 1.25a.5.5 0 0 0 .78-.1l2-2.5a.5.5 0 0 0-.043-.727Z"/>
                    </svg>
                </div>
                <h2 class="fw-bold mb-3">Check Your Email</h2>
                <p class="text-muted mb-4">We have sent a link to reset your password to your email address. If you don't receive it within a few minutes, please check your spam folder.</p>
                <div class="d-grid gap-2">
                    <a href="{% url 'login' %}" class="btn btn-outline-primary py-2 fw-semibold">Return to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
