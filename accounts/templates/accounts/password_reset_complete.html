{% extends 'base.html' %}

{% block title %}Password Reset Complete - Daily Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm text-center">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4 text-success">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-shield-check" viewBox="0 0 16 16">
                      <path d="M5.338 1.59a61.44 61.44 0 0 0-2.837.856.481.481 0 0 0-.328.39c-.554 4.117.773 7.53 2.567 9.223.36.34.884.34 1.244 0 1.794-1.693 3.12-5.106 2.567-9.223a.481.481 0 0 0-.328-.39 61.44 61.44 0 0 0-2.837-.856.481.481 0 0 0-.462 0zM1.83 2.017a1 1 0 0 1 1.077-.188c1.176.444 2.459.75 3.093.75s1.917-.306 3.094-.75a1 1 0 0 1 1.077.188c.84.729 1.485 1.745 1.737 3.018.57 2.879-.187 5.674-1.921 8.016a1 1 0 0 1-1.427.14c-2.119-1.78-4.204-4.872-4.204-8.156 0-.613.064-1.272.186-1.938z"/>
                      <path d="M10.854 5.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 7.793l2.646-2.647a.5.5 0 0 1 .708 0z"/>
                    </svg>
                </div>
                <h2 class="fw-bold mb-3">Password Reset Complete</h2>
                <p class="text-muted mb-4">Your password has been successfully reset! You can now log in with your new password.</p>
                <div class="d-grid gap-2">
                    <a href="{% url 'login' %}" class="btn btn-primary py-2 fw-semibold">Go to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
